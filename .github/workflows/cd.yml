name: CD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # go-sqlite3 needs CGO, so each target is built with a native C toolchain on
  # a runner of the matching OS (darwin/amd64 is cross-compiled by clang on the
  # Apple Silicon runner; windows/arm64 uses a pinned llvm-mingw toolchain).
  # Third-party actions and downloads are pinned by commit SHA or SHA-256.
  # The Linux builds and the release job name Ubuntu 24.04 instead of using
  # ubuntu-latest, so release builds change OS only when these labels are
  # bumped (intel/notes.md Q-011).
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, smoke: true }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { goos: darwin, goarch: arm64, runner: macos-latest, smoke: true }
          - { goos: darwin, goarch: amd64, runner: macos-latest, smoke: false }
          - { goos: windows, goarch: amd64, runner: windows-latest, smoke: true }
          - { goos: windows, goarch: arm64, runner: windows-11-arm, smoke: true }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # The windows-11-arm image has no C compiler targeting aarch64-w64-mingw32,
      # which cgo needs; install a pinned, checksum-verified llvm-mingw.
      - name: Install llvm-mingw (windows/arm64)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        env:
          LLVM_MINGW_VERSION: "20260908"
          LLVM_MINGW_SHA256: "7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56"
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-aarch64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw checksum mismatch: $hash" }
          # Windows' bundled bsdtar reads zip files; Git's GNU tar (possibly first on PATH) cannot.
          & "$env:SystemRoot\System32\tar.exe" -xf $zip -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "extracting llvm-mingw failed with exit code $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "$name\bin")
          Add-Content -Path $env:GITHUB_ENV -Value "CC=aarch64-w64-mingw32-clang"

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # manual run fallback
            echo "tag=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        id: build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/salus_${GOOS}_${GOARCH}${ext}"
          tags=""
          ldflags="-s -w -X main.version=${VERSION}"
          if [ "$GOOS" = "linux" ]; then
            # Link statically so the binary does not depend on the runner's glibc
            # version; netgo/osusergo avoid glibc NSS, and extension loading
            # (dlopen) is not used by salus.
            tags="sqlite_omit_load_extension,osusergo,netgo"
            ldflags="$ldflags -linkmode external -extldflags -static"
          fi
          mkdir -p dist
          go build -tags "$tags" -ldflags="$ldflags" -o "$out" .
          echo "binary=$out" >> "$GITHUB_OUTPUT"

      - name: Smoke test binary
        if: matrix.smoke
        shell: bash
        env:
          SALUS_DB_PATH: ${{ runner.temp }}/smoke.db
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          bin="./${{ steps.build.outputs.binary }}"
          # Confirms the -X main.version ldflag took effect.
          got="$("$bin" --version)"
          if [ "$got" != "salus version $VERSION" ]; then echo "unexpected --version output: $got"; exit 1; fi
          if [ "${{ matrix.goos }}" = "linux" ]; then
            file "$bin" | grep -q "statically linked"
          fi
          "$bin" check list | grep misconfig >/dev/null
          # check run exits 0/1/2 for PASS/WARN/FAIL. Runner host state varies, so
          # only an exit code above 1 fails here; persistence is asserted below.
          status=0
          "$bin" check run --only misconfig || status=$?
          if [ "$status" -gt 1 ]; then echo "check run exited with $status"; exit 1; fi
          "$bin" jobs show 1 | grep misconfig >/dev/null

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error

  # Packages the archives and signs their build provenance (SEC-006). Only
  # first-party actions may run in this job: id-token: write lets any step in
  # it mint signing credentials for this workflow, which a third-party action
  # could use to forge provenance. Manual runs attest too, so this job can be
  # tested before a tag.
  package:
    name: Package and attest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: Package release artifacts
        shell: bash
        run: |
          cd dist
          for bin in salus_*; do
            name="${bin%.exe}"
            chmod +x "$bin"
            if [ "$bin" != "$name" ]; then
              zip -q "${name}.zip" "$bin"
            else
              tar -czf "${name}.tar.gz" "$bin"
            fi
            rm "$bin"
          done
          ls -l

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > checksums.txt

      # Signs SLSA build provenance for every archive in checksums.txt. The
      # verify command is in README.md ("Verifying build provenance").
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error

  # Publishes the attested archives with contents: write, but without the
  # signing permissions of the package job. Manual runs stop after the download.
  release:
    name: Publish release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
