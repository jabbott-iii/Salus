name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Comprehensive CI testing
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod tidy && git diff --exit-code
        shell: bash

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Run tests with coverage
        shell: bash
        run: go test -v -coverprofile=coverage.out './...'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # go-sqlite3 needs CGO, so build natively on each OS and run the binary to
      # prove it can open a database (a CGO-less build compiles but cannot).
      - name: Build and smoke-test native binary
        shell: bash
        env:
          CGO_ENABLED: "1"
          EXT: ${{ runner.os == 'Windows' && '.exe' || '' }}
          SALUS_DB_PATH: ${{ runner.temp }}/ci-smoke.db
        run: |
          go build -o "salus-ci${EXT}" .
          "./salus-ci${EXT}" --version
          "./salus-ci${EXT}" check list | grep misconfig >/dev/null
          # check run exits 0/1/2 for PASS/WARN/FAIL. Runner host state varies, so
          # only an exit code above 1 fails here; persistence is asserted below.
          status=0
          "./salus-ci${EXT}" check run --only misconfig || status=$?
          if [ "$status" -gt 1 ]; then echo "check run exited with $status"; exit 1; fi
          "./salus-ci${EXT}" jobs show 1 | grep misconfig >/dev/null
