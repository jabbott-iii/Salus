name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke-test:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: salus:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build Docker image
        run: docker build --tag "$IMAGE_NAME" --file Dockerfile .

      - name: Smoke test CLI help
        run: |
          docker run --rm "$IMAGE_NAME" --help
          docker run --rm "$IMAGE_NAME" --version

      # Exercises the database on the image's /app/data volume across two runs.
      # The image still runs as root; see SEC-002 in intel/cybersec.md.
      - name: Smoke test database access
        run: |
          docker volume create salus-smoke
          # check run exits 0/1/2 for PASS/WARN/FAIL; only an exit code above 1
          # fails here, and persistence is asserted by the next command.
          status=0
          docker run --rm -v salus-smoke:/app/data "$IMAGE_NAME" check run --only misconfig || status=$?
          if [ "$status" -gt 1 ]; then echo "check run exited with $status"; exit 1; fi
          docker run --rm -v salus-smoke:/app/data "$IMAGE_NAME" jobs show 1 | grep misconfig >/dev/null
